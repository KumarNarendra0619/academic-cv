<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Academic CV</title>
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QR Code Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- PapaParse for Google Sheets Live Data -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
    <style>
        @media print {
            body { background-color: white; color: black; }
            .no-print { display: none !important; }
            .print-border { border-bottom: 2px solid #333; padding-bottom: 10px; }
            /* Force table borders in print */
            th, td { border: 1px solid #d1d5db !important; }
        }
        .accent-text { color: #0ea5e9; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <!-- Action Bar -->
    <div class="no-print bg-white shadow p-4 flex justify-between items-center fixed top-0 w-full z-50">
        <div class="font-bold text-xl text-gray-800">Dynamic<span class="accent-text">CV</span></div>
        <div class="space-x-4">
            <button onclick="window.print()" class="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700">
                📥 Print A4 / PDF
            </button>
            <button onclick="fetchData()" class="bg-gray-800 text-white px-4 py-2 rounded shadow hover:bg-gray-900">
                🔄 Sync Live Data
            </button>
        </div>
    </div>

    <!-- CV Content -->
    <div class="max-w-4xl mx-auto mt-24 mb-10 bg-white shadow-xl rounded-lg p-8 print:mt-0 print:shadow-none">
        
        <!-- Header & QR -->
        <div class="flex justify-between items-start print-border mb-8">
            <div>
                <h1 id="cv-name" class="text-4xl font-extrabold text-gray-900 mb-2">Loading...</h1>
                <h2 id="cv-title" class="text-xl font-semibold accent-text mb-4">...</h2>
                <div class="text-sm text-gray-600 space-y-1">
                    <p id="cv-dept"></p>
                    <p id="cv-uni"></p>
                    <p id="cv-location"></p>
                </div>
            </div>
            <div class="text-center bg-gray-50 p-4 rounded-lg border">
                <div id="qrcode" class="mb-2 flex justify-center"></div>
                <p class="text-xs text-gray-500">Scan for Live CV</p>
            </div>
        </div>

        <!-- Skills Section -->
        <div class="mb-8">
            <h3 class="text-2xl font-bold border-b-2 border-gray-200 pb-2 mb-4">Core Competencies</h3>
            <div id="cv-skills" class="flex flex-wrap gap-2 text-sm font-medium"></div>
        </div>

        <!-- Publications Table (Updated for UGC API) -->
        <div class="mb-8">
            <h3 class="text-2xl font-bold border-b-2 border-gray-200 pb-2 mb-4">Academic Publications & UGC API Profile</h3>
            <table class="min-w-full border-collapse border border-gray-300 text-left text-sm">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="border border-gray-300 p-3 w-20">Year</th>
                        <th class="border border-gray-300 p-3">Publication Details</th>
                        <th class="border border-gray-300 p-3 w-40 text-center">UGC Metrics</th>
                    </tr>
                </thead>
                <tbody id="cv-publications"></tbody>
            </table>
        </div>
    </div>

    <script>
        // PASTE YOUR GOOGLE SHEET CSV LINKS HERE
        const profileCsvUrl = 'YOUR_PROFILE_CSV_LINK_HERE'; 
        const publicationsCsvUrl = 'YOUR_PUBLICATIONS_CSV_LINK_HERE'; // Replace with new Template Link

        // Generate QR Code dynamically for the current URL
        new QRCode(document.getElementById("qrcode"), {
            text: window.location.href,
            width: 100, height: 100,
            colorDark : "#0f172a", colorLight : "#ffffff",
        });

        // Fetch Live Data
        function fetchData() {
            // Fetch Profile Info
            Papa.parse(profileCsvUrl, {
                download: true, header: true,
                complete: function(results) {
                    let profileData = {};
                    results.data.forEach(row => { if(row.Key) profileData[row.Key] = row.Value; });

                    document.getElementById('cv-name').innerText = profileData.Name || '';
                    document.getElementById('cv-title').innerText = profileData.Title || '';
                    document.getElementById('cv-dept').innerText = profileData.Department || '';
                    document.getElementById('cv-uni').innerText = profileData.University || '';
                    document.getElementById('cv-location').innerText = profileData.Location || '';
                    
                    if(profileData.Skills) {
                        const skillsContainer = document.getElementById('cv-skills');
                        skillsContainer.innerHTML = ''; 
                        profileData.Skills.split(',').forEach(skill => {
                            skillsContainer.innerHTML += `<span class="bg-blue-100 px-3 py-1 rounded-full border border-blue-200 text-blue-800">${skill.trim()}</span>`;
                        });
                    }
                }
            });

            // Fetch Publications with new UGC API columns
            Papa.parse(publicationsCsvUrl, {
                download: true, header: true,
                complete: function(results) {
                    const pubTable = document.getElementById('cv-publications');
                    pubTable.innerHTML = ''; 
                    results.data.forEach(pub => {
                        // Match exact column names from the Google Sheet
                        if(pub['Year'] && pub['Title of Paper']) {
                            
                            // Check for DOI and format it safely
                            const doiLink = pub['DOI / Link'] ? `<a href="${pub['DOI / Link']}" target="_blank" class="text-xs text-blue-600 hover:underline no-print mt-2 inline-block">🔗 View Document (DOI)</a>` : '';
                            
                            // Format Authorship Badge
                            const authorBadge = pub['Authorship'] ? `<span class="bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded border border-indigo-200 text-xs font-semibold w-full text-center">${pub['Authorship']}</span>` : '';
                            
                            // Format Impact Factor Badge
                            const ifBadge = pub['Impact Factor'] ? `<span class="bg-green-50 text-green-700 px-2 py-0.5 rounded border border-green-200 text-xs font-semibold w-full text-center">IF: ${pub['Impact Factor']}</span>` : '';
                            
                            // Peer Reviewed Check
                            const peerText = pub['Peer-Reviewed'] === 'Yes' ? `<span class="text-gray-500 text-xs text-center w-full">✓ Peer-Reviewed</span>` : '';

                            pubTable.innerHTML += `
                                <tr class="hover:bg-gray-50 transition">
                                    <td class="border border-gray-300 p-3 align-top font-semibold text-gray-700">${pub['Year']}</td>
                                    <td class="border border-gray-300 p-3 align-top">
                                        <div class="font-bold text-gray-900 text-base mb-1">${pub['Title of Paper']}</div>
                                        <div class="text-sm text-gray-600">
                                            <span class="italic font-medium">${pub['Journal Name']}</span> 
                                            ${pub['ISSN / ISBN'] ? `| ISSN: ${pub['ISSN / ISBN']}` : ''}
                                        </div>
                                        ${doiLink}
                                    </td>
                                    <td class="border border-gray-300 p-3 align-top">
                                        <div class="flex flex-col gap-1 items-center justify-center">
                                            ${authorBadge}
                                            ${ifBadge}
                                            ${peerText}
                                        </div>
                                    </td>
                                </tr>
                            `;
                        }
                    });
                }
            });
        }
        window.onload = fetchData;
    </script>
</body>
</html>
